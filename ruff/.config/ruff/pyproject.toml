target-version = "py311"
[tool.ruff.lint]
# Curated recommended set, not everything. Start from Ruff's defaults (E, F)
# and add a few high-value extensions.
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
# Line length is handled by the formatter.
ignore = ["E501"]
exclude = ["python"]
