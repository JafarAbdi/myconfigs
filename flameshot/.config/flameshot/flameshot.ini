[General]
checkForUpdates=true
# i3/x11 has xdg-desktop-portal, but its gtk backend has no Screenshot interface.
# Flameshot v14 needs this to bypass the portal and capture via native X11.
useX11LegacyScreenshot=true
# v14 added a monitor-selection screen on multi-monitor setups; auto-select the
# monitor under the cursor instead (X11/Windows only, unsupported on Wayland).
captureActiveMonitor=true
contrastOpacity=188
showStartupLaunchMessage=false
startupLaunch=false
