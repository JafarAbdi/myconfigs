# Master pre-commit hook reference — a curated menu of hooks covering common
# languages and tools (Python, Rust, C++, general/whitespace, docs, security,
# etc.), including the conventions used by uv, ruff, pre-commit-hooks, and
# requests upstream.
#
# This is NOT meant to be installed as-is. It's a menu, organized by language/
# tool section below. The `precommit-setup` skill reads this file, decides
# which sections apply to a target repo, and writes a `.pre-commit-config.yaml`
# there containing only those sections, deleted wholesale — not toggled by
# commenting/uncommenting.
#
# Run hooks with `prek`, not `pre-commit` — prek (https://github.com/j178/prek)
# is a drop-in, single-binary, Rust-based reimplementation: same config file
# format, no Python bootstrap step, parallel hook execution.
#   prek install          # instead of `pre-commit install`
#   prek run --all-files  # instead of `pre-commit run --all-files`
#   prek autoupdate       # bump every `rev:` below to latest — do this periodically,
#                         # the pins here are a snapshot, not a permanent pin.

repos:
  # =====================================================================
  # GENERAL — applies to every repo regardless of language
  # =====================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-vcs-permalinks
      - id: check-xml
      - id: forbid-new-submodules
      - id: name-tests-test
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: pretty-format-json

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos

  # =====================================================================
  # PYTHON — ruff covers lint + format + import-sort + pyupgrade + security
  # (via its "S"/flake8-bandit rules) in one tool. Pair this hook with the
  # ruff config in references/ruff.toml (a good default select/ignore list).
  # =====================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # uv projects: keep uv.lock in sync with pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.12.3"
    hooks:
      - id: uv-lock

  # Static typing
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.70
    hooks:
      - id: ty
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: "1.2.0"
    hooks:
      - id: pyrefly-check

  # Jupyter notebook repos — strip outputs before commit
  - repo: https://github.com/srstevenson/nb-clean
    rev: 4.0.1
    hooks:
      - id: nb-clean
        args: [--remove-empty-cells]

  # Django projects
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.31.1
    hooks:
      - id: django-upgrade
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.44.2
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django

  # =====================================================================
  # RUST — no official upstream pre-commit repo; use local hooks calling cargo.
  # =====================================================================
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # =====================================================================
  # C++ / CMake
  # =====================================================================
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format

  # =====================================================================
  # TOML formatting (beyond the syntax-only check-toml above)
  # =====================================================================
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  # =====================================================================
  # YAML lint (beyond the syntax-only check-yaml above)
  # =====================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # =====================================================================
  # MARKDOWN / DOCS
  # =====================================================================
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check

  # =====================================================================
  # JAVASCRIPT / TYPESCRIPT LINT — oxlint. Configure in `.oxlintrc.json`
  # (see references/oxlintrc.json), not hook args. `args: [--fix]` autofixes.
  # =====================================================================
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.78.0
    hooks:
      - id: oxlint

  # OPT-IN anti-slop — 15 rules against LLM-shaped TS (unknown params/returns,
  # chained assertions, runtime typeof). https://github.com/dmmulroy/anti-slop
  # Not on npm: vendor it at a pinned SHA, keep `oxlint` and `@oxlint/plugins`
  # on one version, list under `jsPlugins` in oxlint.config.ts.
  # Exclude the vendored dir from oxlint and from this file's top-level
  # `exclude:` — it uses tabs; whitespace hooks would break re-vendoring.
  #   - repo: local        # mirror's isolated env can't load a repo-local plugin
  #     hooks:
  #       - id: oxlint-anti-slop
  #         name: oxlint (anti-slop)
  #         entry: npx oxlint --config oxlint.config.ts
  #         language: system
  #         types_or: [ts, tsx, javascript, jsx]

  # OPT-IN type-aware rules (no-floating-promises etc). Needs TypeScript 7.0+
  # and `npm add -D oxlint oxlint-tsgolint`. Local because tsgolint reads the
  # repo's own tsconfig/@types. Whole-program, so no filenames — types_or keeps
  # docs commits off it. Add `--type-check` to drop `tsc --noEmit`. RAM-hungry.
  - repo: local
    hooks:
      - id: oxlint-type-aware
        name: oxlint (type-aware)
        entry: npx oxlint --type-aware
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

  # =====================================================================
  # FORMATTING (node repos) — oxfmt (Beta) replaces prettier. Native: JS/TS,
  # JSON(C/5), CSS/SCSS/Less, GraphQL, YAML. Bundled prettier, no install:
  # HTML/Vue/Svelte/MD/MDX/Handlebars/MJML. Sorts imports + Tailwind classes.
  # Config `.oxfmtrc.json`; `oxfmt --migrate=prettier` converts an existing one.
  #
  # The two overrides widen the mirror's JS/TS-only default — delete them to
  # keep it on JS/TS. Regex, not types_or: identify has no tag for
  # json5/jsonc/mdx/scss/less and unknown tags are a hard error.
  #
  # `.toml` left out: taplo-format above owns it. If you take the widened form,
  # drop pretty-format-json (fights over .json) and yamllint (its rules disagree
  # with oxfmt's YAML → reformat-then-fail loop).
  # =====================================================================
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.63.0
    hooks:
      - id: oxfmt
        types_or: [text]
        files: \.(js|jsx|mjs|cjs|ts|tsx|mts|cts|json|jsonc|json5|css|scss|less|pcss|postcss|graphql|gql|graphqls|ya?ml|html?|xhtml|vue|svelte|md|markdown|mdx|hbs|handlebars|mjml)$

  # =====================================================================
  # DOCKER
  # =====================================================================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  # =====================================================================
  # GITHUB ACTIONS
  # =====================================================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  # =====================================================================
  # SECURITY — Python security linting is handled by ruff's "S" rules
  # (see references/ruff.toml), not a separate bandit hook.
  # =====================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # =====================================================================
  # LUA (only relevant to Neovim config / Lua repos)
  # =====================================================================
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github
  - repo: https://github.com/Calinou/pre-commit-luacheck
    rev: v1.0.0
    hooks:
      - id: luacheck

  # =====================================================================
  # LICENSE HEADERS
  # =====================================================================
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense

  # =====================================================================
  # CUSTOM / PROJECT-SPECIFIC LINTS — house conventions no linter ships with.
  # Check existing configs first: ruff and oxlint both have hundreds of opt-in
  # rules most repos leave switched off. Then, cheapest first:
  #
  # 1. `repo: local` — any executable. See the Rust section above.
  # 2. ast-grep — structural YAML rules, ~20 languages, no upstream hook so
  #    wire it locally (below). sgconfig.yml -> ruleDirs; rules/*.yml ->
  #    id/language/severity/message/rule; rule-tests/*.yml -> `ast-grep test`.
  #    Match on kind/pattern/regex + inside/has/follows/precedes, composed
  #    with all/any/not/matches. Gotchas: `pattern` misses nodes the grammar
  #    wraps (use `regex`); one `not:` per object (wrap in `all:`); `regex`
  #    is not multiline — `^` anchors to node text, not each line.
  # 3. oxlint JS plugin — for JS/TS rules needing scope or symbols, which
  #    ast-grep has no access to. In .oxlintrc.json / oxlint.config.ts:
  #      jsPlugins: [{ name: "house", specifier: "./tools/house/index.ts" }]
  #    then enable as "house/<rule-id>": "error". The anti-slop block in the
  #    JS/TS LINT section above is a worked example of this shape.
  # =====================================================================
  - repo: local
    hooks:
      - id: ast-grep
        name: ast-grep (custom structural lints)
        entry: ast-grep scan
        language: system
        types: [text]
        require_serial: false
