# Reference ruff configuration — a good default `[tool.ruff]` block.
#
# Usable as a standalone ruff.toml, or fold each top-level table below into
# `[tool.ruff]` / `[tool.ruff.lint]` / etc. inside pyproject.toml.
#
# `target-version` is intentionally unset — read it off the repo's actual
# `requires-python` in pyproject.toml rather than guessing.

line-length = 120

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort (import sorting)
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
  "S",   # flake8-bandit (security) — this is why a separate `bandit` hook isn't needed
  "PLC", # pylint convention
  "PLE", # pylint errors
  "PLR", # pylint refactor
  "PLW", # pylint warnings
]
ignore = [
  "E501",    # line too long — defer to the formatter, not the linter
  "E741",    # ambiguous variable name (l, O, I) — common in math/robotics code
  "F722",    # jaxtyping forward-annotation false positive
  "F821",    # jaxtyping forward-annotation false positive
  "UP037",   # jaxtyping: "remove quotes from type" false positive
  "UP040",   # jaxtyping: beartype requires TypeAlias, not PEP 695 `type`
  "PLR2004", # magic value used in comparison
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLC0414", # import alias doesn't rename — used intentionally for re-exports
  "PLC1901", # compare-to-empty-string instead of falsey check
  "PLR5501", # use `elif` instead of nested `else: if`
  "PLW0603", # global statement usage
  "PLW2901", # loop variable overwritten inside the loop body
]

[lint.per-file-ignores]
"__init__.py" = ["F401"] # unused import — fine in re-export modules
"tests/**"    = ["S101"] # assert usage is expected/fine in tests

[lint.pydocstyle]
convention = "google"

[format]
quote-style  = "double"
indent-style = "space"
